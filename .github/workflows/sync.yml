name: Sync upstream

on:
  schedule:
    # 18:00 UTC = 02:00 北京时间
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel to sync (latest or stable)'
        type: choice
        options: [latest, stable, both]
        default: both

permissions:
  contents: write   # for committing channels/*.txt and creating releases
  issues: write     # for opening failure issues

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel:
          # workflow_dispatch with "both" expands via the if guards below
          - latest
          - stable
    steps:
      - uses: actions/checkout@v4

      - name: Skip if not requested channel
        id: gate
        run: |
          requested="${{ github.event.inputs.channel || 'both' }}"
          if [[ "$requested" == "both" || "$requested" == "${{ matrix.channel }}" ]]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi

      - name: Resolve target version
        if: steps.gate.outputs.run == 'true'
        id: version
        run: |
          V=$(curl -fsSL --retry 3 "https://downloads.claude.ai/claude-code-releases/${{ matrix.channel }}")
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "Channel ${{ matrix.channel }} → $V"

      - name: Check if release already exists
        if: steps.gate.outputs.run == 'true'
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release $TAG already exists, will only update channel pointer"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Run sync.sh
        if: steps.gate.outputs.run == 'true' && steps.check.outputs.exists == 'false'
        env:
          CHANNEL: ${{ matrix.channel }}
          WORK_DIR: ./work
        run: |
          chmod +x sync/sync.sh
          ./sync/sync.sh

      - name: Create release with artifacts
        if: steps.gate.outputs.run == 'true' && steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.version }}"
          TAG="v$V"
          # Mark the "latest" channel release as GH Latest, "stable" channel
          # explicitly NOT, so race timing between matrix jobs doesn't decide it.
          if [[ "${{ matrix.channel }}" == "latest" ]]; then
            LATEST_FLAG="--latest=true"
          else
            LATEST_FLAG="--latest=false"
          fi
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --notes "Auto-mirrored from downloads.claude.ai on $(date -u '+%Y-%m-%d %H:%M UTC')" \
            $LATEST_FLAG \
            ./work/$V/*

      - name: Re-affirm Latest flag on existing release
        # Runs even when sync.sh was skipped (release already existed) — handles
        # the case where channels diverged previously and Latest is now wrong.
        if: steps.gate.outputs.run == 'true' && steps.check.outputs.exists == 'true' && matrix.channel == 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.version }}"
          gh release edit "v$V" --repo "${{ github.repository }}" --latest=true

      - name: Update channel pointer
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p channels
          echo -n "${{ steps.version.outputs.version }}" > "channels/${{ matrix.channel }}.txt"

      - name: Commit channel pointer
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add channels/
          if git diff --cached --quiet; then
            echo "channel pointer unchanged, nothing to commit"
            exit 0
          fi
          git commit -m "chore: bump ${{ matrix.channel }} → ${{ steps.version.outputs.version }}"
          # Retry-rebase loop in case the parallel sync job pushed first
          for i in 1 2 3; do
            git pull --rebase origin main || true
            if git push; then
              exit 0
            fi
            echo "push attempt $i failed, retrying..."
            sleep 5
          done
          echo "push failed after retries"
          exit 1

      - name: Open issue on failure
        if: failure() && steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Sync failed: ${{ matrix.channel }} on $(date -u +%Y-%m-%d)" \
            --body "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "sync-failure" || true

  cleanup-old-releases:
    runs-on: ubuntu-latest
    needs: sync
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Keep only most recent N releases
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: 5
        run: |
          # Keep the 5 most recent releases by tag, delete older ones (and their tags).
          # Skips drafts and prereleases.
          TO_DELETE=$(gh release list --repo "${{ github.repository }}" \
            --exclude-drafts --exclude-pre-releases \
            --limit 100 --json tagName,createdAt \
            | jq -r --argjson k "$KEEP" 'sort_by(.createdAt) | reverse | .[$k:][].tagName')
          for tag in $TO_DELETE; do
            echo "deleting old release $tag"
            gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag || true
          done
