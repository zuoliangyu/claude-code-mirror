name: Sync upstream

on:
  schedule:
    # 18:00 UTC = 02:00 北京时间
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel to sync (latest or stable)'
        type: choice
        options: [latest, stable, both]
        default: both

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel:
          - latest
          - stable
    steps:
      - uses: actions/checkout@v4

      - name: Skip if not requested channel
        id: gate
        run: |
          requested="${{ github.event.inputs.channel || 'both' }}"
          if [[ "$requested" == "both" || "$requested" == "${{ matrix.channel }}" ]]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi

      - name: Resolve target version
        if: steps.gate.outputs.run == 'true'
        id: version
        run: |
          V=$(curl -fsSL --retry 3 "https://downloads.claude.ai/claude-code-releases/${{ matrix.channel }}")
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "Channel ${{ matrix.channel }} → $V"

      - name: Check if release already exists
        if: steps.gate.outputs.run == 'true'
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release $TAG already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Run sync.sh (native binaries)
        if: steps.gate.outputs.run == 'true' && steps.check.outputs.exists == 'false'
        env:
          CHANNEL: ${{ matrix.channel }}
          WORK_DIR: ./work
        run: |
          ./sync/sync.sh

      - name: Run sync-npm.sh (npm tarballs)
        # Always run when this channel is being processed — even if release already
        # exists, so retroactively-added npm files get uploaded with --clobber.
        if: steps.gate.outputs.run == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          WORK_DIR: ./work
        run: |
          ./sync/sync-npm.sh

      - name: Create release with all artifacts (new version)
        if: steps.gate.outputs.run == 'true' && steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.version }}"
          TAG="v$V"
          if [[ "${{ matrix.channel }}" == "latest" ]]; then
            LATEST_FLAG="--latest=true"
          else
            LATEST_FLAG="--latest=false"
          fi
          # Collect all files from native (top level) + npm/ subdir.
          mapfile -t files < <(find ./work/$V -type f)
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --notes "Auto-mirrored from downloads.claude.ai (native) + registry.npmjs.org (npm) on $(date -u '+%Y-%m-%d %H:%M UTC')" \
            $LATEST_FLAG \
            "${files[@]}"

      - name: Upload npm tarballs to existing release (retroactive)
        # Only fires when release was pre-existing (didn't go through the
        # "Create release" step above). Adds npm tgz files to old releases.
        if: steps.gate.outputs.run == 'true' && steps.check.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.version }}"
          TAG="v$V"
          npm_dir="./work/$V/npm"
          if [ -d "$npm_dir" ]; then
            mapfile -t files < <(find "$npm_dir" -type f)
            for f in "${files[@]}"; do
              echo "uploading: $f"
              gh release upload "$TAG" "$f" --repo "${{ github.repository }}" --clobber
            done
          fi

      - name: Re-affirm Latest flag on existing release
        if: steps.gate.outputs.run == 'true' && steps.check.outputs.exists == 'true' && matrix.channel == 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.version }}"
          gh release edit "v$V" --repo "${{ github.repository }}" --latest=true

      - name: Update channel pointer
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p channels
          echo -n "${{ steps.version.outputs.version }}" > "channels/${{ matrix.channel }}.txt"

      - name: Commit channel pointer
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add channels/
          if git diff --cached --quiet; then
            echo "channel pointer unchanged, nothing to commit"
            exit 0
          fi
          git commit -m "chore: bump ${{ matrix.channel }} → ${{ steps.version.outputs.version }}"
          for i in 1 2 3; do
            git pull --rebase origin main || true
            if git push; then
              exit 0
            fi
            echo "push attempt $i failed, retrying..."
            sleep 5
          done
          echo "push failed after retries"
          exit 1

      - name: Open issue on failure
        if: failure() && steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Sync failed: ${{ matrix.channel }} on $(date -u +%Y-%m-%d)" \
            --body "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "sync-failure" || true
